<html lang="en">
<head>
	<meta charset="utf-8">
	<title>Friday Night Funkin vs Huggy Wuggy v2.1</title>
	<meta id="viewport" name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
	<meta name="apple-mobile-web-app-capable" content="yes">
	<style>
		* { margin: 0; padding: 0; box-sizing: border-box; }
		html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
		#wrap { position: relative; width: 100%; height: 100%; overflow: hidden; }
		iframe { position: absolute; border: none; }
	</style>
<script>
var VX_EQ_GAINS=[3,5,3,1,2,3,2,3,4,2];
var VX_VOL=1.15;
(function(){
  var FREQ=[31,63,125,250,500,1000,2000,4000,8000,16000];
  var OAC=window.AudioContext||window.webkitAudioContext;
  var ctxs=[];
  function PAC(o){
    var ctx=o?new OAC(o):new OAC();
    var mg=ctx.createGain();mg.gain.value=VX_VOL;
    var fl=FREQ.map(function(f,i){
      var n=ctx.createBiquadFilter();n.type="peaking";
      n.frequency.value=f;n.Q.value=1.4;n.gain.value=VX_EQ_GAINS[i]||0;return n;
    });
    for(var i=0;i<fl.length-1;i++)fl[i].connect(fl[i+1]);
    fl[fl.length-1].connect(mg);mg.connect(ctx.destination);
    Object.defineProperty(ctx,"destination",{get:function(){return fl[0];}});
    ctxs.push(ctx);window.__vxCtx=ctxs;return ctx;
  }
  PAC.prototype=OAC.prototype;
  window.AudioContext=PAC;
  if(window.webkitAudioContext)window.webkitAudioContext=PAC;
})();
</script>
<script>
  var inIframe = (window.self !== window.top);
  var barH = 29;
  var gameW = 1280;
  var gameH = 720;

  window.addEventListener("keydown", function(e) {
    if(["Space","ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].indexOf(e.code) > -1) {
      e.preventDefault();
    }
    // ESC exits fullscreen
    if (e.code === "Escape") {
      var isFs = document.fullscreenElement || document.webkitFullscreenElement;
      if (isFs) {
        if (document.exitFullscreen) document.exitFullscreen();
        else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
      }
    }
  }, false);

  function resizeGame() {
    var iframe = document.getElementById("game");
    var wrap = document.getElementById("wrap");
    var ww = wrap.offsetWidth;
    var wh = wrap.offsetHeight;

    if (inIframe) {
      iframe.style.position = "absolute";
      iframe.style.left = "0px";
      iframe.style.top = "0px";
      iframe.style.width = ww + "px";
      iframe.style.height = wh + "px";
      wrap.style.overflow = "hidden";
    } else {
      var scale = Math.max(ww / gameW, wh / gameH);
      var w = gameW * scale;
      var h = gameH * scale;
      var left = (ww - w) / 2;
      var top = (wh - h) / 2;
      iframe.style.width = w + "px";
      iframe.style.height = (h + barH * scale) + "px";
      iframe.style.left = left + "px";
      iframe.style.top = (top - barH * scale) + "px";
    }
  }

  // Inject CSS into the game iframe to hide side gaps and play more bar
  function injectIframeCSS() {
    var iframe = document.getElementById("game");
    if (!iframe) return;
    try {
      var doc = iframe.contentDocument || iframe.contentWindow.document;
      if (!doc || !doc.head) return;
      var style = doc.createElement("style");
      style.textContent = [
        "#playmore { display:none !important; }",
        "body { overflow:hidden !important; margin:0 !important; padding:0 !important; }",
        "canvas { display:block !important; }"
      ].join(" ");
      doc.head.appendChild(style);
    } catch(e) {}
  }

  var scanInterval = setInterval(function() {
    var iframe = document.getElementById("game");
    if (!iframe) return;
    try {
      var doc = iframe.contentDocument || iframe.contentWindow.document;
      if (doc) {
        var el = doc.getElementById("playmore");
        if (el) { el.remove(); }
        injectIframeCSS();
        clearInterval(scanInterval);
      }
    } catch(e) {}
  }, 100);

  function toggleFullscreen() {
    var iframe = document.getElementById("game");
    var btn = document.getElementById("fsBtn");
    var isFs = document.fullscreenElement || document.webkitFullscreenElement;
    if (!isFs) {
      if (iframe.requestFullscreen) iframe.requestFullscreen();
      else if (iframe.webkitRequestFullscreen) iframe.webkitRequestFullscreen();
    } else {
      if (document.exitFullscreen) document.exitFullscreen();
      else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
    }
  }

  function onFsChange() {
    var btn = document.getElementById("fsBtn");
    if (!btn) return;
    var isFs = document.fullscreenElement || document.webkitFullscreenElement;
    // Hide button when in fullscreen, show when not
    btn.style.display = isFs ? "none" : "flex";
  }

  document.addEventListener("fullscreenchange", onFsChange);
  document.addEventListener("webkitfullscreenchange", onFsChange);

  window.addEventListener("load", resizeGame);
  window.addEventListener("resize", resizeGame);
</script>
</head>
<body>
	<div id="wrap">
<button id="fsBtn" onclick="toggleFullscreen()" style="
  position:fixed;
  bottom:10px;
  right:10px;
  z-index:99999;
  background:rgba(0,0,0,0.6);
  color:white;
  border:1px solid rgba(255,255,255,0.3);
  border-radius:6px;
  font-size:20px;
  width:36px;
  height:36px;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:0;
  opacity:0.5;
  transition:opacity 0.2s;
" onmouseover="this.style.opacity='1'" onmouseout="this.style.opacity='0.5'">⛶</button>
		<iframe
			id="game"
			src="https://fnf.kdata1.com/huggy-wuggy/2.1/"
			allowfullscreen
			allow="autoplay; fullscreen; gamepad; cross-origin-isolated"
			scrolling="no">
		</iframe>
	</div>
</body>
</html>
